name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
         
          cache-dependency-path: habit-hub-client/package-lock.json

      - name: Install dependencies
        run: |
          cd habit-hub-client
          npm ci

      - name: Type check (TypeScript)
        run: |
          cd habit-hub-client
          npm run build